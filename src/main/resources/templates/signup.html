<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GamerBuddy - Sign Up</title>
    <link rel="stylesheet" type="text/css" th:href="@{/styles.css}" />
</head>
<body>
<div class="container">
    <h1 class="logo">GamerBuddy</h1>

    <!-- Display error message if any -->
    <div th:if="${error}" class="error-message" style="color: red; margin-bottom: 20px;">
        <p th:text="${error}"></p>
    </div>

    <form th:action="@{/signup}" th:object="${user}" method="post" class="signup-form">
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}" placeholder="Input here..." required>
        </div>
        <div class="input-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" th:field="*{fullName}" placeholder="Input here..." required>
        </div>
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="Input here..." required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" placeholder="Input here..." required>
        </div>
        <!-- Favorite Game drop-down -->
        <div class="input-group">
            <label for="favoriteGame">Favorite Game</label>
            <select id="favoriteGame" th:field="*{favoriteGame}" required>
                <option value="" disabled selected>Select your favorite game</option>
                <option th:each="game : ${games}" th:value="${game.name}" th:text="${game.name}"></option>
            </select>
        </div>
        <!-- New Favorite Game Genre input field -->
        <!-- Favorite Game Genre drop-down -->
        <div class="input-group">
            <label for="favoriteGameGenre">Favorite Game Genre</label>
            <select id="favoriteGameGenre" th:field="*{favoriteGameGenre}" required>
                <option value="" disabled selected>Select your favorite game genre</option>
                <option th:each="genre : ${gameGenres}" th:value="${genre.name}" th:text="${genre.name}"></option>
            </select>
        </div>
        <button type="submit" class="btn-reg btn">Confirm Registration</button>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GamerBuddy - Log In</title>
    <link rel="stylesheet" type="text/css" th:href="@{/styles.css}" />
</head>
<body>
<div class="container">
    <h1 class="logo">GamerBuddy</h1>

    <!-- Display error message if any -->
    <div th:if="${param.error}" class="error-message" style="color: red; margin-bottom: 20px;">
        <p>Invalid username or password.</p>
    </div>

    <form th:action="@{/login}" method="post" class="login-form">
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Input here..." required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Input here..." required>
        </div>
        <button type="submit" class="btn login-btn">Log In</button>
    </form>
</div>
</body>
</html>

services:
  db:
    image: postgres:17
    container_name: gamerbuddy-db
    restart: always
    environment:
      POSTGRES_DB: postgres  # Keep as 'postgres' to allow init.sql to run
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

volumes:
  postgres-data:
